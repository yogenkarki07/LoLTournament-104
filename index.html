<!DOCTYPE html>

<head>

    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>
<body>
  
    <header class="header-section">
        <div class="head">
            <img src="./assets/menu.svg" alt="menu-icon" id="menu">
        </div>
        <div class="head">
            <h2> Weather </h2>
        </div>
        <div class="head">
            <img src="./assets/search.svg" alt="search-icon" id="search">

        <div id="description" class="description"> </div>

                <div class="lvl-1">

                </div>

            </div>

            <div class="inner-box">
                <div class="lvl-1">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">

                <div class="lvl-1">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">

    <footer class="footer-section">
        <div class="foot">
            <a href="./index.html">
            <img src="./assets/cloud.svg" alt="cloud-icon" id="cloud">

            </a>
        </div>
        <div class="foot">
            <a href="./forecast.html">
                <img src="./assets/date.svg" alt="date-icon" id="date">
                <p> Forecast </p>
            </a>
        </div>
        <div class="foot">
            <a href="./city.html">
                <img src="./assets/location.svg" alt="location-icon" id="location">
                <p> Cities </p>
            </a>
        </div>
        <div class="foot">
            <a href="./setting.html">
            <img src="./assets/setting.svg" alt="setting-icon" id="setting">
            <p> Setting </p>
            </a>
        </div>
    </footer>


     <div id="weather-container"></div>
    <script src="./main.js"></script>
</body>
</html>
